---
- name: Validate the complete controller inventory before opening SSH
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Record the expected Tassadar host set
      ansible.builtin.set_fact:
        connectivity_expected_hosts:
          - flowerca-1
          - grafana-1
          - prometheus-1
          - pxc-1
          - pxc-2
          - pxc-3
          - pxc-bastion

    - name: Require every expected host and role group
      ansible.builtin.assert:
        that:
          - groups.get('all', []) | sort == connectivity_expected_hosts
          - groups.get('bastion', []) == ['pxc-bastion']
          - groups.get('pxc', []) | sort == ['pxc-1', 'pxc-2', 'pxc-3']
          - groups.get('flowerca', []) == ['flowerca-1']
          - groups.get('prometheus', []) == ['prometheus-1']
          - groups.get('grafana', []) == ['grafana-1']
          - groups.get('node_exporter', []) | sort == connectivity_expected_hosts
        fail_msg: Regenerate the complete Tassadar inventory; all seven managed hosts and groups are required.

- name: Check SSH authentication and Python on every managed VM
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse a partial host selection
      ansible.builtin.assert:
        that:
          - >-
            (ansible_play_hosts_all | sort)
            == (hostvars['localhost'].connectivity_expected_hosts | default([]) | sort)
        fail_msg: Connectivity must check the complete expected host set.
      run_once: true

    - name: Wait for SSH and Python after provisioning
      ansible.builtin.wait_for_connection:
        timeout: "{{ connectivity_wait_timeout | default(300) }}"
        connect_timeout: 10
        sleep: 5

    - name: Check the Ansible connection
      ansible.builtin.ping:

    - name: Verify the unprivileged automation login
      ansible.builtin.command: id --user --name
      register: connectivity_login
      changed_when: false
      become: false

    - name: Require the dedicated Ansible SSH account
      ansible.builtin.assert:
        that:
          - connectivity_login.stdout | trim == 'ansible'
        fail_msg: SSH must connect as the dedicated ansible account, not root.

    - name: Verify noninteractive privilege escalation
      ansible.builtin.command: id --user
      become: true
      become_user: root
      register: connectivity_sudo
      changed_when: false

    - name: Require root privileges for service provisioning
      ansible.builtin.assert:
        that:
          - connectivity_sudo.stdout | trim == '0'
        fail_msg: The ansible account must support noninteractive sudo for provisioning.

    - name: Wait for first-boot SSH configuration to finish
      ansible.builtin.command: cloud-init status --wait
      become: true
      changed_when: false

    - name: Read the actual SSH connection addresses without sudo
      ansible.builtin.command: printenv SSH_CONNECTION
      become: false
      register: connectivity_ssh_connection
      changed_when: false

    - name: Decode the SSH connection tuple
      ansible.builtin.set_fact:
        connectivity_ssh_peer: "{{ connectivity_ssh_connection.stdout.split() }}"

    - name: Require a valid SSH connection tuple before testing Match rules
      ansible.builtin.assert:
        that:
          - connectivity_ssh_peer | length == 4
          - connectivity_ssh_peer[0] is match('^[0-9a-fA-F:.]+$')
          - connectivity_ssh_peer[2] is match('^[0-9a-fA-F:.]+$')
          - connectivity_ssh_peer[1] is match('^[0-9]+$')
          - connectivity_ssh_peer[3] is match('^[0-9]+$')
          - 0 < connectivity_ssh_peer[1] | int <= 65535
          - 0 < connectivity_ssh_peer[3] | int <= 65535
        fail_msg: SSH_CONNECTION must identify the actual client and server addresses and ports.

    - name: Read the SSH policy for the automation and root accounts including Match rules
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - >-
            user={{ item }},host={{ connectivity_ssh_peer[0] }},addr={{ connectivity_ssh_peer[0] }},laddr={{ connectivity_ssh_peer[2] }},lport={{ connectivity_ssh_peer[3] }}
      become: true
      loop: [ansible, root]
      register: connectivity_sshd
      changed_when: false

    - name: Require key-only SSH and disabled root login
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in item.stdout_lines"
          - "'passwordauthentication no' in item.stdout_lines"
          - "'kbdinteractiveauthentication no' in item.stdout_lines"
          - "'pubkeyauthentication yes' in item.stdout_lines"
          - "'authenticationmethods publickey' in item.stdout_lines"
          # Numeric peer hostnames above match sshd's behavior with UseDNS disabled.
          - "'usedns no' in item.stdout_lines"
        fail_msg: Both SSH accounts must deny root/password login and require public keys with UseDNS disabled.
      loop: "{{ connectivity_sshd.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Record successful connectivity only after all authentication and sudo checks finish
      ansible.builtin.copy:
        content: "{{ ansible_play_hosts_all | sort | to_json }}"
        dest: "{{ connectivity_summary_path }}"
        mode: "0600"
      when: connectivity_summary_path | default('') | length > 0
      delegate_to: localhost
      connection: local
      run_once: true
