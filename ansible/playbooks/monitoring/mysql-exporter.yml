---
- name: Validate monitoring inputs before changing services
  ansible.builtin.import_playbook: check-mysql-exporter-inputs.yml

- name: Install MySQL Exporter on the healthy PXC cluster
  hosts: pxc
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Load shared PXC credential defaults
      ansible.builtin.import_role:
        name: pxc_config
        public: true
    - name: Validate PXC credentials
      ansible.builtin.import_role:
        name: pxc_preflight
        tasks_from: credentials
  roles:
    - mysql_exporter

- name: Configure Prometheus and verify MySQL metrics from every PXC node
  hosts: prometheus
  become: true
  any_errors_fatal: true
  roles:
    - prometheus
  tasks:
    - name: Register the three exporter endpoints
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/mysql-targets.yml.j2"
        dest: /etc/prometheus/mysql-targets.yml
        owner: root
        group: prometheus
        mode: "0640"

    - name: Verify current MySQL scrape addresses and target health
      ansible.builtin.uri:
        url: "http://{{ prometheus_address }}:9090/api/v1/targets?state=active"
        use_proxy: false
        return_content: true
      vars:
        mysql_expected_scrape_urls: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~ '/../../templates/mysql-targets.yml.j2')
             | from_yaml | map(attribute='targets') | flatten
             | map('regex_replace', '^', 'http://')
             | map('regex_replace', '$', '/metrics') | list }}
      register: mysql_scrape_targets
      changed_when: false
      until:
        - mysql_scrape_targets.status | default(0) == 200
        - mysql_scrape_targets.json.status | default('') == 'success'
        - >-
          (mysql_scrape_targets.json.data.activeTargets | default([])
           | selectattr('labels.job', 'equalto', 'mysql')
           | map(attribute='labels.instance') | sort | list) == (groups['pxc'] | sort)
        - >-
          (mysql_scrape_targets.json.data.activeTargets | default([])
           | selectattr('labels.job', 'equalto', 'mysql')
           | sort(attribute='labels.instance') | map(attribute='scrapeUrl') | list)
          == mysql_expected_scrape_urls
        - >-
          (mysql_scrape_targets.json.data.activeTargets | default([])
           | selectattr('labels.job', 'equalto', 'mysql')
           | map(attribute='health') | unique | list) == ['up']
      retries: 12
      delay: 5

    - name: Verify live MySQL and Galera metrics from all expected nodes
      ansible.builtin.uri:
        url: "http://{{ prometheus_address }}:9090/api/v1/query?query={{ item.query | urlencode }}"
        use_proxy: false
        return_content: true
      register: mysql_metrics
      changed_when: false
      until:
        - mysql_metrics.status | default(0) == 200
        - mysql_metrics.json.status | default('') == 'success'
        - >-
          (mysql_metrics.json.data.result | default([]) | map(attribute='metric.instance') | sort | list)
          == (groups['pxc'] | sort)
        - >-
          (mysql_metrics.json.data.result | default([]) | map(attribute='value') | map('last') | unique | list)
          == [item.expected]
      loop:
        - {query: 'up{job="mysql"}', expected: "1"}
        - {query: 'mysql_up{job="mysql"}', expected: "1"}
        - {query: 'mysql_global_status_wsrep_cluster_size{job="mysql"}', expected: "3"}
        - {query: 'mysql_global_status_wsrep_cluster_status{job="mysql"}', expected: "1"}
        - {query: 'mysql_global_status_wsrep_local_state{job="mysql"}', expected: "4"}
        - {query: 'mysql_global_status_wsrep_ready{job="mysql"}', expected: "1"}
      retries: 12
      delay: 5

- name: Provision the PXC dashboard in Grafana
  hosts: grafana
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Load Grafana defaults and validate the current admin password
      ansible.builtin.import_role:
        name: grafana
        tasks_from: credentials
        public: true
  tasks:
    - name: Install PXC dashboard in the existing Grafana dashboard provider
      ansible.builtin.copy:
        src: ../../roles/grafana/files/tassadar-pxc.json
        dest: /etc/grafana/dashboards/tassadar-pxc.json
        owner: root
        group: grafana
        mode: "0640"

    - name: Verify the current provisioned PXC dashboard content
      ansible.builtin.import_role:
        name: grafana
        tasks_from: verify-dashboard
      vars:
        grafana_dashboard_file: "{{ playbook_dir }}/../../roles/grafana/files/tassadar-pxc.json"
