---
- name: Require the complete PXC inventory
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Load shared PXC defaults without overriding inventory
      ansible.builtin.import_role:
        name: pxc_config
        public: true
      tags: [always]
  tasks:
    - name: Validate verification inputs
      ansible.builtin.import_role:
        name: pxc_preflight
        tasks_from: inputs
  tags: [always]

- name: Verify PXC health and cross-node writes without reinstalling
  hosts: pxc
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Load shared PXC defaults without overriding inventory
      ansible.builtin.import_role:
        name: pxc_config
        public: true
      tags: [always]
  tasks:
    - name: Validate the credential resolved for every PXC node
      ansible.builtin.import_role:
        name: pxc_preflight
        tasks_from: credentials
    - name: Verify the cluster with the validated node credentials
      ansible.builtin.import_role:
        name: pxc_verify
  tags: [verify]
