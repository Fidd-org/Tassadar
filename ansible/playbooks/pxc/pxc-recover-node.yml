---
- name: Validate monitoring inventory and credentials before recovery changes
  ansible.builtin.import_playbook: ../monitoring/check-mysql-exporter-inputs.yml

- name: Validate PXC node recovery
  hosts: pxc
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Load shared PXC defaults without overriding inventory
      ansible.builtin.import_role:
        name: pxc_config
        public: true
      tags: [always]
  tasks:
    - name: Run PXC node recovery preflight checks
      ansible.builtin.include_role:
        name: pxc_recover_node
        tasks_from: preflight
        apply:
          tags:
            - recovery
      run_once: true
      tags:
        - recovery

- name: Prepare the PXC recovery node
  hosts: "{{ pxc_recovery_node | default('pxc-recovery-target-not-set') }}"
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Load shared PXC defaults without overriding inventory
      ansible.builtin.import_role:
        name: pxc_config
        public: true
      tags: [always]
  roles:
    - role: pxc
      tags:
        - recovery

- name: Recover the PXC node
  hosts: pxc
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Load shared PXC defaults without overriding inventory
      ansible.builtin.import_role:
        name: pxc_config
        public: true
      tags: [always]
  tasks:
    - name: Join the recovery node to the healthy cluster
      ansible.builtin.include_role:
        name: pxc_recover_node
        apply:
          tags:
            - recovery
      run_once: true
      tags:
        - recovery

- name: Restore host metrics on the recovered PXC node
  hosts: "{{ pxc_recovery_node | default('pxc-recovery-target-not-set') }}"
  become: true
  any_errors_fatal: true
  roles:
    - node_exporter

- name: Restore MySQL metrics and monitoring targets from the current inventory
  ansible.builtin.import_playbook: ../monitoring/mysql-exporter.yml
