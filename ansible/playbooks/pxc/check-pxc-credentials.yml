---
- name: Validate PXC credentials before provisioning resources
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Load shared PXC defaults without overriding inventory
      ansible.builtin.import_role:
        name: pxc_config
        public: true
      tags: [always]
  tasks:
    - name: Reuse protected PXC credential validation
      ansible.builtin.import_role:
        name: pxc_preflight
        tasks_from: credentials
