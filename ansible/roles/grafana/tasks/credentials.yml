---
- name: Validate the runtime Grafana administrator password without exposing it
  ansible.builtin.assert:
    that:
      - grafana_admin_password is string
      - grafana_admin_password | length >= 20
      - grafana_admin_password == grafana_admin_password | trim
      - "'\n' not in grafana_admin_password"
      - "'\r' not in grafana_admin_password"
    fail_msg: Supply the current strong Grafana admin password using a protected variable or GRAFANA_ADMIN_PASSWORD.
  no_log: true
