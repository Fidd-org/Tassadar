---
- name: Validate the PXC administrator password without exposing it
  ansible.builtin.assert:
    that:
      - pxc_root_password is string
      - >-
        not (pxc_require_runtime_password | default(false) | bool)
        or pxc_root_password == lookup('ansible.builtin.env', 'PXC_ROOT_PASSWORD')
      - pxc_root_password | length >= (20 if pxc_require_runtime_password | default(false) | bool else 12)
      - pxc_root_password == pxc_root_password | trim
      - >-
        '\n' not in pxc_root_password
      - >-
        '\r' not in pxc_root_password
      - >-
        "'" not in pxc_root_password
      - >-
        '\\' not in pxc_root_password
    fail_msg: >-
      Supply the current PXC root password without single quotes, backslashes,
      CR/LF or surrounding whitespace; CI requires at least 20 characters.
  no_log: true
