---
pxc_repo: pxc80
pxc_cluster_name: tassadar-pxc
pxc_provider: /usr/lib/galera4/libgalera_smm.so
pxc_sst_method: xtrabackup-v2
pxc_root_user: root
pxc_mysql_datadir: /var/lib/mysql
pxc_data_device: "/dev/disk/by-id/scsi-0DO_Volume_{{ inventory_hostname }}-data"
pxc_data_filesystem: ext4
pxc_do_automount_path: "/mnt/{{ (inventory_hostname ~ '-data') | replace('-', '_') }}"
pxc_do_automount_unit: "{{ pxc_do_automount_path.lstrip('/') | replace('/', '-') }}.mount"
pxc_tls_files:
  - ca.pem
  - server-cert.pem
  - server-key.pem
  - client-cert.pem
  - client-key.pem
pxc_tls_private_files:
  - server-key.pem
  - client-key.pem

pxc_generated_password_dir: >-
  {{ (inventory_dir if inventory_dir | default('', true) is ansible.builtin.abs
      else playbook_dir ~ '/../..') ~ '/.generated' }}
pxc_root_password: >-
  {{ lookup('ansible.builtin.env', 'PXC_ROOT_PASSWORD')
     if pxc_require_runtime_password | default(false) | bool
     else (pxc_root_password_override if pxc_root_password_override is defined
           else (lookup('ansible.builtin.env', 'PXC_ROOT_PASSWORD')
                 if lookup('ansible.builtin.env', 'PXC_ROOT_PASSWORD') | length > 0
                 else lookup('ansible.builtin.password', pxc_generated_password_dir ~ '/pxc_root_password length=24 chars=ascii_letters,digits'))) }}

pxc_cluster_hosts: "{{ groups['pxc'] | default([]) }}"
pxc_cluster_address: "gcomm://{{ pxc_cluster_hosts | map('extract', hostvars, 'ansible_host') | join(',') }}"
