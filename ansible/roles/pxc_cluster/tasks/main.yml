---
- name: Require exactly three PXC nodes
  ansible.builtin.assert:
    that:
      - groups['pxc'] | length == 3
      - "'pxc-1' in groups['pxc']"
      - "'pxc-2' in groups['pxc']"
      - "'pxc-3' in groups['pxc']"
    fail_msg: "PXC cluster role expects pxc-1, pxc-2, and pxc-3 in the pxc inventory group."
  run_once: true
  tags:
    - cluster
    - verify

- name: Require a fresh deployment decision before bootstrap
  ansible.builtin.assert:
    that:
      - pxc_deployment_mode | default('') == 'fresh'
    fail_msg: Run the complete deployment preflight; bootstrap is allowed only for three new empty nodes.
  run_once: true
  tags: [cluster]

- name: Start bootstrap mysql service
  ansible.builtin.systemd:
    name: mysql@bootstrap.service
    state: started
    enabled: false
  delegate_to: pxc-1
  run_once: true
  tags:
    - cluster

- name: Wait for MySQL on bootstrap node
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 3306
    timeout: 180
  delegate_to: pxc-1
  run_once: true
  tags:
    - cluster

- name: Read bootstrap wsrep status
  ansible.builtin.command: >
    mysql --user={{ pxc_root_user }}
    --batch --skip-column-names
    --execute="SHOW STATUS WHERE Variable_name IN
    ('wsrep_cluster_size', 'wsrep_cluster_status', 'wsrep_local_state_comment', 'wsrep_connected', 'wsrep_ready');"
  environment:
    MYSQL_PWD: "{{ pxc_root_password }}"
  register: pxc_bootstrap_wsrep_status
  changed_when: false
  until:
    - "'wsrep_cluster_size\t1' in pxc_bootstrap_wsrep_status.stdout_lines"
    - "'wsrep_cluster_status\tPrimary' in pxc_bootstrap_wsrep_status.stdout_lines"
    - "'wsrep_local_state_comment\tSynced' in pxc_bootstrap_wsrep_status.stdout_lines"
    - "'wsrep_connected\tON' in pxc_bootstrap_wsrep_status.stdout_lines"
    - "'wsrep_ready\tON' in pxc_bootstrap_wsrep_status.stdout_lines"
  retries: 36
  delay: 5
  delegate_to: pxc-1
  run_once: true
  no_log: true
  tags:
    - cluster

- name: Read PXC TLS file content
  ansible.builtin.slurp:
    src: "{{ pxc_mysql_datadir }}/{{ item }}"
  loop: "{{ pxc_tls_files }}"
  register: pxc_tls_file_content
  delegate_to: pxc-1
  run_once: true
  no_log: true
  tags:
    - cluster

- name: Join remaining PXC nodes
  ansible.builtin.include_tasks: join.yml
  loop: "{{ groups['pxc'] | reject('equalto', 'pxc-1') | sort }}"
  loop_control:
    loop_var: pxc_joiner
  run_once: true
  tags:
    - cluster

- name: Enable regular MySQL startup after the initial cluster is formed
  ansible.builtin.systemd:
    name: mysql
    enabled: true
  delegate_to: pxc-1
  run_once: true
  tags: [cluster]
