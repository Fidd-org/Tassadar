name: Manage PXC

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy, verify, monitor, recover one PXC node, or test recovery
        type: choice
        options:
          - deploy
          - verify
          - monitor
          - recover
          - test-recovery
        default: verify
        required: true

      recovery_node:
        description: Node to recover or deliberately stop during the recovery test
        type: choice
        options: [pxc-1, pxc-2, pxc-3]
        default: pxc-3
        required: true
      allow_sst:
        description: Allow SST to replace MySQL data on the selected recovery node
        type: boolean
        default: false
      allow_node_stop:
        description: For test-recovery, allow stopping MySQL on the selected test node
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tassadar-production
  cancel-in-progress: false

jobs:
  pxc:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ansible
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out Tassadar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the requested operation
        id: request
        env:
          OPERATION: ${{ inputs.operation }}
          RECOVERY_NODE: ${{ inputs.recovery_node }}
          ALLOW_SST: ${{ inputs.allow_sst }}
          ALLOW_NODE_STOP: ${{ inputs.allow_node_stop }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            deploy|verify|monitor|recover|test-recovery) ;;
            *) echo '::error::Choose deploy, verify, monitor, recover, or test-recovery'; exit 1 ;;
          esac
          if [[ "$OPERATION" == recover || "$OPERATION" == test-recovery ]]; then
            case "$RECOVERY_NODE" in
              pxc-1|pxc-2|pxc-3) ;;
              *) echo '::error::Choose a PXC recovery node'; exit 1 ;;
            esac
            if [[ "$ALLOW_SST" != true ]]; then
              echo '::error::Acknowledge possible SST on the selected node'
              exit 1
            fi
            if [[ "$OPERATION" == test-recovery && "$ALLOW_NODE_STOP" != true ]]; then
              echo '::error::Acknowledge the deliberate MySQL stop for test-recovery'
              exit 1
            fi
          fi

      - name: Install OpenTofu for reading state outputs
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      - name: Install Ansible
        id: ansible
        run: |
          set -euo pipefail
          ansible_venv="$RUNNER_TEMP/tassadar-ansible-venv"
          python3 -m venv "$ansible_venv"
          "$ansible_venv/bin/python" -m pip install --disable-pip-version-check -r "$GITHUB_WORKSPACE/ansible/requirements.txt"
          echo "$ansible_venv/bin" >> "$GITHUB_PATH"

      - name: Prepare controller SSH identity
        id: ssh
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          INFRA_SSH_PUBLIC_KEY: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
        run: bash ../.github/scripts/prepare-ansible-ssh.sh

      - name: Validate PXC credentials
        id: pxc_credentials
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          PXC_ROOT_PASSWORD: ${{ secrets.PXC_ROOT_PASSWORD }}
        run: ansible-playbook -i localhost, playbooks/pxc/check-pxc-credentials.yml -e pxc_require_runtime_password=true

      - name: Initialize the existing S3 state backend
        id: initialize
        working-directory: tofu
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for required_name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::$required_name is required"
              exit 1
            fi
          done
          tofu init -input=false -lockfile=readonly -no-color

      - name: Prepare inventory from the current state outputs
        id: inventory
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: bash ../.github/scripts/prepare-ansible-inventory.sh

      - name: Check SSH and Python on PXC nodes through the bastion
        id: connectivity
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: |
          ansible -i "$RUNNER_TEMP/tassadar-ansible/inventory.yml" pxc \
            --module-name ansible.builtin.wait_for_connection \
            --args 'timeout=300 connect_timeout=10 sleep=5'

      - name: Deploy a new PXC cluster or verify the healthy existing cluster
        id: pxc
        if: inputs.operation == 'deploy'
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          PXC_ROOT_PASSWORD: ${{ secrets.PXC_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          runtime_directory="$RUNNER_TEMP/tassadar-ansible"
          pxc_exit=0
          ansible-playbook -i "$runtime_directory/inventory.yml" playbooks/pxc/pxc.yml \
            -e "@$runtime_directory/inventory-vars.json" -e pxc_require_runtime_password=true || pxc_exit=$?
          if [[ -f "$runtime_directory/pxc-deployment.json" ]]; then
            deployment_mode="$(jq -er '.mode | select(. == "fresh" or . == "healthy")' "$runtime_directory/pxc-deployment.json")"
            echo "deployment_mode=$deployment_mode" >> "$GITHUB_OUTPUT"
            if [[ "$pxc_exit" == 0 ]]; then
              jq -e '.verified == true' "$runtime_directory/pxc-deployment.json" > /dev/null
            fi
          elif [[ "$pxc_exit" == 0 ]]; then
            echo '::error::PXC completed without a verified deployment report'
            exit 1
          fi
          exit "$pxc_exit"

      - name: Verify PXC health and cross-node replication
        id: verify_pxc
        if: inputs.operation == 'verify'
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          PXC_ROOT_PASSWORD: ${{ secrets.PXC_ROOT_PASSWORD }}
        run: ansible-playbook -i "$RUNNER_TEMP/tassadar-ansible/inventory.yml" playbooks/pxc/pxc-verify.yml -e pxc_require_runtime_password=true

      - name: Install MySQL Exporter and verify Galera metrics
        id: monitor
        if: inputs.operation == 'monitor'
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          PXC_ROOT_PASSWORD: ${{ secrets.PXC_ROOT_PASSWORD }}
          MYSQL_EXPORTER_PASSWORD: ${{ secrets.MYSQL_EXPORTER_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: ansible-playbook -i "$RUNNER_TEMP/tassadar-ansible/inventory.yml" playbooks/monitoring/mysql-exporter.yml -e pxc_require_runtime_password=true

      - name: Recover the selected node or test single-node recovery
        id: recovery
        if: inputs.operation == 'recover' || inputs.operation == 'test-recovery'
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          PXC_ROOT_PASSWORD: ${{ secrets.PXC_ROOT_PASSWORD }}
          OPERATION: ${{ inputs.operation }}
          RECOVERY_NODE: ${{ inputs.recovery_node }}
        run: |
          set -euo pipefail
          test_allow_node_stop=false
          case "$OPERATION" in
            recover) playbook=playbooks/pxc/pxc-recover-node.yml ;;
            test-recovery)
              playbook=playbooks/pxc/pxc-test-recovery.yml
              test_allow_node_stop=true
              ;;
            *) exit 1 ;;
          esac
          ansible-playbook -i "$RUNNER_TEMP/tassadar-ansible/inventory.yml" "$playbook" \
            -e pxc_require_runtime_password=true \
            -e "pxc_recovery_node=$RECOVERY_NODE" -e pxc_recovery_allow_sst=true \
            -e "pxc_test_allow_node_stop=$test_allow_node_stop"

      - name: Remove controller SSH files and generated inventory
        id: cleanup_ssh
        if: always()
        run: bash ../.github/scripts/cleanup-ansible-ssh.sh

      - name: Report PXC operation result
        if: always()
        env:
          OPERATION: ${{ inputs.operation }}
          JOB_STATUS: ${{ job.status }}
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          ANSIBLE_OUTCOME: ${{ steps.ansible.outcome }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.pxc_credentials.outcome }}
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          CONNECTIVITY_OUTCOME: ${{ steps.connectivity.outcome }}
          PXC_OUTCOME: ${{ steps.pxc.outcome }}
          PXC_DEPLOYMENT_MODE: ${{ steps.pxc.outputs.deployment_mode }}
          VERIFY_OUTCOME: ${{ steps.verify_pxc.outcome }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
          RECOVERY_NODE: ${{ inputs.recovery_node }}
          CLEANUP_OUTCOME: ${{ steps.cleanup_ssh.outcome }}
        run: |
          {
            echo '### PXC operation'
            echo
            echo "Requested operation: $OPERATION"
            echo
            echo '| Step | Result |'
            echo '| --- | --- |'
            echo "| Request validation | $REQUEST_OUTCOME |"
            echo "| Ansible installation | $ANSIBLE_OUTCOME |"
            echo "| SSH identity | $SSH_OUTCOME |"
            echo "| PXC credentials | $CREDENTIALS_OUTCOME |"
            echo "| S3 backend initialization | $INITIALIZE_OUTCOME |"
            echo "| Inventory from state outputs | $INVENTORY_OUTCOME |"
            echo "| PXC SSH/Python through bastion | $CONNECTIVITY_OUTCOME |"
            echo "| PXC deployment (${PXC_DEPLOYMENT_MODE:-not-classified}) | $PXC_OUTCOME |"
            echo "| Standalone health and replication | $VERIFY_OUTCOME |"
            echo "| MySQL Exporter, Prometheus and PXC dashboard | $MONITOR_OUTCOME |"
            echo "| Recovery or outage test ($RECOVERY_NODE) | $RECOVERY_OUTCOME |"
            echo "| Controller files cleanup | $CLEANUP_OUTCOME |"
            echo
            if [[ "$JOB_STATUS" == cancelled ]]; then
              echo '**PXC operation canceled.** Inspect the cluster before retrying; cancellation does not roll back service changes.'
            elif [[ "$JOB_STATUS" == success && "$REQUEST_OUTCOME" == success &&
                    "$ANSIBLE_OUTCOME" == success && "$SSH_OUTCOME" == success &&
                    "$CREDENTIALS_OUTCOME" == success && "$INITIALIZE_OUTCOME" == success &&
                    "$INVENTORY_OUTCOME" == success && "$CONNECTIVITY_OUTCOME" == success &&
                    "$CLEANUP_OUTCOME" == success ]] &&
                 { [[ "$OPERATION" == deploy && "$PXC_OUTCOME" == success ]] ||
                   [[ "$OPERATION" == verify && "$VERIFY_OUTCOME" == success ]] ||
                   [[ "$OPERATION" == monitor && "$MONITOR_OUTCOME" == success ]] ||
                   [[ "$OPERATION" == recover && "$RECOVERY_OUTCOME" == success ]] ||
                   [[ "$OPERATION" == test-recovery && "$RECOVERY_OUTCOME" == success ]]; }; then
              if [[ "$OPERATION" == monitor ]]; then
                echo '**MySQL monitoring enabled. Prometheus verified all three PXC nodes and the PXC dashboard was provisioned.**'
              elif [[ "$OPERATION" == test-recovery ]]; then
                echo '**Recovery test passed. Writes during the outage were read on all three nodes after recovery.**'
              else
                echo '**PXC operation completed; health and cross-node replication verified.**'
              fi
            else
              echo '**PXC operation did not complete.** Inspect the failed step; existing resources and data are retained.'
            fi
            echo
            echo 'This workflow reads infrastructure outputs and never runs infrastructure plan/apply/destroy.'
            echo 'Deploy bootstraps only three new empty nodes; an existing healthy cluster is verified.'
            echo 'Verify writes and reads the dedicated percona.example test table; application data is not tested.'
            echo 'Recover rejoins one selected node. Test-recovery deliberately stops MySQL on that node and verifies writes before, during, and after the outage.'
          } >> "$GITHUB_STEP_SUMMARY"
