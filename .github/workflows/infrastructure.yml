name: Manage infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes, deploy infrastructure with monitoring, or check VM connectivity
        type: choice
        options:
          - plan
          - apply
          - check
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: tassadar-production
  cancel-in-progress: false

jobs:
  infrastructure:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: tofu
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out Tassadar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      - name: Install Ansible for deployment and connectivity checks
        id: ansible
        if: inputs.operation == 'apply' || inputs.operation == 'check'
        run: |
          ansible_venv="$RUNNER_TEMP/tassadar-ansible-venv"
          python3 -m venv "$ansible_venv"
          "$ansible_venv/bin/python" -m pip install --disable-pip-version-check -r "$GITHUB_WORKSPACE/ansible/requirements.txt"
          echo "$ansible_venv/bin" >> "$GITHUB_PATH"

      - name: Prepare runtime configuration
        id: configure
        if: inputs.operation != 'check'
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          OPERATION: ${{ inputs.operation }}
          INFRA_SSH_PUBLIC_KEY: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
          INFRA_ADMIN_CIDR: ${{ vars.INFRA_ADMIN_CIDR || '0.0.0.0/0' }}
          INFRA_PROJECT_ID: ${{ vars.INFRA_PROJECT_ID }}
          INFRA_REGION: ${{ vars.INFRA_REGION || 'fra1' }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            plan|apply) ;;
            *) echo '::error::Choose plan or apply'; exit 1 ;;
          esac
          for required_name in TF_VAR_digitalocean_token AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY INFRA_SSH_PUBLIC_KEY; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::$required_name is required"
              exit 1
            fi
          done
          if [[ -n "$INFRA_PROJECT_ID" && ! "$INFRA_PROJECT_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo '::error::INFRA_PROJECT_ID must be a project UUID or empty'
            exit 1
          fi

          umask 077
          runtime_directory="$RUNNER_TEMP/tassadar-infra"
          mkdir -p -- "$runtime_directory"
          printf '%s\n' "$INFRA_SSH_PUBLIC_KEY" | tr -d '\r' > "$runtime_directory/ssh.pub"
          if [[ "$(awk 'NF { count++ } END { print count+0 }' "$runtime_directory/ssh.pub")" != 1 ]] ||
             ! grep -Eq '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh.com|sk-ecdsa-sha2-nistp256@openssh.com) ' "$runtime_directory/ssh.pub" ||
             ! ssh-keygen -lf "$runtime_directory/ssh.pub" > /dev/null 2>&1; then
            echo '::error::INFRA_SSH_PUBLIC_KEY must contain one valid OpenSSH public key, already registered in DigitalOcean'
            exit 1
          fi

          jq -n \
            --arg key_path "$runtime_directory/ssh.pub" \
            --arg cidr "$INFRA_ADMIN_CIDR" \
            --arg project "$INFRA_PROJECT_ID" \
            --arg region "$INFRA_REGION" \
            '{ssh_public_key_path: $key_path, admin_cidr: $cidr,
              project_id: (if $project == "" then null else $project end),
              region: $region}' > "$runtime_directory/variables.tfvars.json"

      - name: Prepare controller SSH identity
        id: ssh
        if: inputs.operation == 'apply' || inputs.operation == 'check'
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          INFRA_SSH_PUBLIC_KEY: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
        run: bash ../.github/scripts/prepare-ansible-ssh.sh

      - name: Validate monitoring credentials before changing infrastructure
        id: monitoring_credentials
        if: inputs.operation == 'apply'
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: ansible-playbook -i localhost, playbooks/check-monitoring-credentials.yml

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Initialize infrastructure state
        id: initialize
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for required_name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::$required_name is required"
              exit 1
            fi
          done
          tofu init -input=false -lockfile=readonly -no-color

      - name: Validate configuration
        id: validate
        if: inputs.operation != 'check'
        run: tofu validate -no-color

      - name: Plan infrastructure
        id: plan
        if: inputs.operation != 'check'
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          runtime_directory="$RUNNER_TEMP/tassadar-infra"
          set +e
          tofu plan -input=false -no-color -detailed-exitcode -lock-timeout=5m \
            -var-file="$runtime_directory/variables.tfvars.json" \
            -out="$runtime_directory/plan.tfplan"
          plan_exit=$?
          set -e
          if [[ "$plan_exit" != 0 && "$plan_exit" != 2 ]]; then
            exit "$plan_exit"
          fi

          # Only aggregate action counts leave this pipe; plan JSON can contain secrets.
          tofu show -json "$runtime_directory/plan.tfplan" |
            jq -r '
              [.resource_changes[]? | select(.mode == "managed") | .change.actions[]] as $actions |
              "create=\($actions | map(select(. == "create")) | length)",
              "update=\($actions | map(select(. == "update")) | length)",
              "delete=\($actions | map(select(. == "delete")) | length)",
              "forget=\($actions | map(select(. == "forget")) | length)"
            ' >> "$GITHUB_OUTPUT"

      - name: Apply infrastructure
        id: apply
        if: inputs.operation == 'apply'
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: tofu apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/tassadar-infra/plan.tfplan"

      - name: Prepare the current controller inventory
        id: inventory
        if: inputs.operation == 'apply' || inputs.operation == 'check'
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          runtime_directory="$RUNNER_TEMP/tassadar-ansible"
          jq -n \
            --arg key "$runtime_directory/identity" \
            --arg hosts "$runtime_directory/known_hosts" \
            --arg inventory "$runtime_directory/inventory.yml" \
            --arg config "$runtime_directory/ssh_config" \
            --arg summary "$runtime_directory/connectivity.json" \
            '{inventory_ssh_private_key_path: $key, inventory_known_hosts_path: $hosts,
              inventory_output_path: $inventory, inventory_ssh_config_path: $config,
              connectivity_summary_path: $summary, inventory_host_key_checking: "accept-new"}' > "$runtime_directory/inventory-vars.json"
          ansible-playbook -i localhost, playbooks/prepare-inventory.yml \
            -e "@$runtime_directory/inventory-vars.json"

      - name: Check SSH and Python on every VM
        id: connectivity
        if: inputs.operation == 'apply' || inputs.operation == 'check'
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: |
          set -euo pipefail
          runtime_directory="$RUNNER_TEMP/tassadar-ansible"
          ansible-playbook -i "$runtime_directory/inventory.yml" playbooks/check-connectivity.yml \
            -e "@$runtime_directory/inventory-vars.json"
          echo "host_count=$(jq 'length' "$runtime_directory/connectivity.json")" >> "$GITHUB_OUTPUT"

      - name: Deploy Node Exporter on every VM
        id: node_exporter
        if: inputs.operation == 'apply'
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: ansible-playbook -i "$RUNNER_TEMP/tassadar-ansible/inventory.yml" playbooks/node-exporter.yml

      - name: Deploy Prometheus and check all scrape targets
        id: prometheus
        if: inputs.operation == 'apply'
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: ansible-playbook -i "$RUNNER_TEMP/tassadar-ansible/inventory.yml" playbooks/prometheus.yml

      - name: Deploy Grafana and provision its data source and dashboard
        id: grafana
        if: inputs.operation == 'apply'
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: ansible-playbook -i "$RUNNER_TEMP/tassadar-ansible/inventory.yml" playbooks/grafana.yml

      - name: Verify final Prometheus targets and host metrics
        id: verify_prometheus
        if: inputs.operation == 'apply'
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: ansible-playbook -i "$RUNNER_TEMP/tassadar-ansible/inventory.yml" playbooks/prometheus-verify.yml

      - name: Verify final Grafana integration and dashboard
        id: verify_grafana
        if: inputs.operation == 'apply'
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: ansible-playbook -i "$RUNNER_TEMP/tassadar-ansible/inventory.yml" playbooks/grafana-verify.yml

      - name: Remove temporary configuration and plan
        id: cleanup_infra
        if: always()
        run: |
          runtime_directory="$RUNNER_TEMP/tassadar-infra"
          if [[ -d "$runtime_directory" ]]; then
            rm -f -- "$runtime_directory/plan.tfplan" \
              "$runtime_directory/variables.tfvars.json" "$runtime_directory/ssh.pub"
            rmdir -- "$runtime_directory"
          fi

      - name: Remove controller SSH files and generated inventory
        id: cleanup_ssh
        if: always()
        run: |
          runtime_directory="$RUNNER_TEMP/tassadar-ansible"
          if [[ -f "$runtime_directory/.owned-by-tassadar" ]]; then
            rm -f -- "$runtime_directory/identity" "$runtime_directory/known_hosts" \
              "$runtime_directory/identity.pub" "$runtime_directory/expected.pub" \
              "$runtime_directory/inventory.yml" "$runtime_directory/ssh_config" \
              "$runtime_directory/inventory-vars.json" "$runtime_directory/connectivity.json" \
              "$runtime_directory/.owned-by-tassadar"
            rmdir -- "$runtime_directory"
          fi

      - name: Report operation result
        if: always()
        env:
          ANSIBLE_OUTCOME: ${{ steps.ansible.outcome }}
          MONITORING_CREDENTIALS_OUTCOME: ${{ steps.monitoring_credentials.outcome }}
          NODE_EXPORTER_OUTCOME: ${{ steps.node_exporter.outcome }}
          PROMETHEUS_OUTCOME: ${{ steps.prometheus.outcome }}
          GRAFANA_OUTCOME: ${{ steps.grafana.outcome }}
          VERIFY_PROMETHEUS_OUTCOME: ${{ steps.verify_prometheus.outcome }}
          VERIFY_GRAFANA_OUTCOME: ${{ steps.verify_grafana.outcome }}
          CLEANUP_INFRA_OUTCOME: ${{ steps.cleanup_infra.outcome }}
          CLEANUP_SSH_OUTCOME: ${{ steps.cleanup_ssh.outcome }}
          OPERATION: ${{ inputs.operation }}
          JOB_STATUS: ${{ job.status }}
          CONFIGURATION_OUTCOME: ${{ steps.configure.outcome }}
          INITIALIZATION_OUTCOME: ${{ steps.initialize.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          CONNECTIVITY_OUTCOME: ${{ steps.connectivity.outcome }}
          HOST_COUNT: ${{ steps.connectivity.outputs.host_count }}
          CREATE_COUNT: ${{ steps.plan.outputs.create }}
          UPDATE_COUNT: ${{ steps.plan.outputs.update }}
          DELETE_COUNT: ${{ steps.plan.outputs.delete }}
          FORGET_COUNT: ${{ steps.plan.outputs.forget }}
        run: |
          {
            echo '### Infrastructure operation'
            echo
            echo "Requested operation: $OPERATION"
            echo
            echo '| Step | Result |'
            echo '| --- | --- |'
            echo "| Ansible installation | $ANSIBLE_OUTCOME |"
            echo "| Monitoring credentials preflight | $MONITORING_CREDENTIALS_OUTCOME |"
            echo "| Runtime configuration | $CONFIGURATION_OUTCOME |"
            echo "| S3 backend initialization | $INITIALIZATION_OUTCOME |"
            echo "| Configuration validation | $VALIDATION_OUTCOME |"
            echo "| Plan | $PLAN_OUTCOME |"
            echo "| Apply | $APPLY_OUTCOME |"
            echo "| SSH identity | $SSH_OUTCOME |"
            echo "| Inventory | $INVENTORY_OUTCOME |"
            echo "| SSH and Python connectivity | $CONNECTIVITY_OUTCOME |"
            echo "| Node Exporter deployment | $NODE_EXPORTER_OUTCOME |"
            echo "| Prometheus deployment | $PROMETHEUS_OUTCOME |"
            echo "| Grafana deployment | $GRAFANA_OUTCOME |"
            echo "| Final Prometheus verification | $VERIFY_PROMETHEUS_OUTCOME |"
            echo "| Final Grafana verification | $VERIFY_GRAFANA_OUTCOME |"
            echo "| Infrastructure temporary files cleanup | $CLEANUP_INFRA_OUTCOME |"
            echo "| Controller SSH files cleanup | $CLEANUP_SSH_OUTCOME |"
            if [[ "$PLAN_OUTCOME" == success ]]; then
              echo
              echo '| Planned action | Resource count |'
              echo '| --- | --- |'
              echo "| Create | $CREATE_COUNT |"
              echo "| Update | $UPDATE_COUNT |"
              echo "| Delete (including replacements) | $DELETE_COUNT |"
              echo "| Forget state entry | $FORGET_COUNT |"
            fi
            echo
            if [[ "$JOB_STATUS" == cancelled ]]; then
              echo '**Operation canceled.**'
              echo 'Cancellation does not roll back infrastructure or service changes. Inspect state and remote cleanup before retrying.'
            elif [[ "$OPERATION" == check && "$CONNECTIVITY_OUTCOME" == success && "$CLEANUP_SSH_OUTCOME" == success && "$CLEANUP_INFRA_OUTCOME" == success ]]; then
              echo "**SSH and Python checks completed on $HOST_COUNT hosts.**"
              echo 'This does not verify database or monitoring service health.'
            elif [[ "$OPERATION" == apply && "$APPLY_OUTCOME" == success &&
                    "$ANSIBLE_OUTCOME" == success && "$MONITORING_CREDENTIALS_OUTCOME" == success &&
                    "$SSH_OUTCOME" == success && "$INVENTORY_OUTCOME" == success &&
                    "$CONNECTIVITY_OUTCOME" == success && "$NODE_EXPORTER_OUTCOME" == success &&
                    "$PROMETHEUS_OUTCOME" == success && "$GRAFANA_OUTCOME" == success &&
                    "$VERIFY_PROMETHEUS_OUTCOME" == success && "$VERIFY_GRAFANA_OUTCOME" == success &&
                    "$CLEANUP_SSH_OUTCOME" == success && "$CLEANUP_INFRA_OUTCOME" == success ]]; then
              echo '**Infrastructure and monitoring deployment completed.**'
              echo "SSH/Python checked on $HOST_COUNT hosts; all expected host metrics, the Grafana data source and dashboard verified."
            elif [[ "$OPERATION" == plan && "$PLAN_OUTCOME" == success && "$CLEANUP_SSH_OUTCOME" == success && "$CLEANUP_INFRA_OUTCOME" == success ]]; then
              echo '**Plan completed. Apply was not requested.**'
            else
              echo '**Requested operation did not complete.** Inspect the failed step logs.'
              if [[ "$APPLY_OUTCOME" == success ]]; then
                echo 'Infrastructure apply succeeded, but deployment or cleanup did not complete.'
              fi
              echo 'An interrupted or failed deployment can leave partially changed infrastructure or services.'
              echo 'Resources are retained; there is no automatic destroy or rollback. Inspect failures and rerun after fixing the cause.'
            fi
            echo
            echo 'The check operation does not create resources or install services.'
            echo 'PXC deployment/recovery and MySQL metrics are not part of this operation.'
          } >> "$GITHUB_STEP_SUMMARY"
