name: Validate code
run-name: "Validate code | ${{ github.event.pull_request.title || github.event.head_commit.message || github.sha }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tassadar-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opentofu:
    name: OpenTofu validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Tassadar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      - name: Check formatting and configuration without the state backend
        run: bash .github/scripts/validate-opentofu.sh

  ansible:
    name: Ansible validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Tassadar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Ansible runtime
        shell: bash
        run: |
          set -euo pipefail
          ansible_venv="$RUNNER_TEMP/tassadar-validation-venv"
          python3 -m venv "$ansible_venv"
          "$ansible_venv/bin/python" -m pip install --disable-pip-version-check -r ansible/requirements.txt
          echo "$ansible_venv/bin" >> "$GITHUB_PATH"

      - name: Parse all Ansible YAML and check playbook syntax
        run: bash .github/scripts/validate-ansible.sh

  shellcheck:
    name: ShellCheck analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Tassadar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned ShellCheck release
        run: bash .github/scripts/install-analysis-tool.sh shellcheck

      - name: Analyze all shell scripts
        run: bash .github/scripts/validate-analysis.sh shellcheck

  actionlint:
    name: Actionlint analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Tassadar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Actionlint and ShellCheck releases
        run: |
          bash .github/scripts/install-analysis-tool.sh shellcheck
          bash .github/scripts/install-analysis-tool.sh actionlint

      - name: Analyze workflows and their inline shell commands
        run: bash .github/scripts/validate-analysis.sh actionlint

  zizmor:
    name: Zizmor analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Tassadar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Zizmor release
        run: bash .github/scripts/install-analysis-tool.sh zizmor

      - name: Analyze workflow security without GitHub API access
        run: bash .github/scripts/validate-analysis.sh zizmor
